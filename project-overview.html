px}.case-container h1{font-size:clamp(2.9rem,12vw,5rem)}.case-intro{font-size:.98rem}.case-layout{display:block;margin-top:42px}.case-aside{display:none}.case-section h2{font-size:1.7rem}.case-section p{font-size:.96rem;line-height:1.82}.case-bottom{flex-direction:column;gap:14px}}</style></head><body class="project-page"><header class="site-header"><div class="header-left"><a class="back-link" href="projects.html">← All projects</a><a href="index.html" class="brand-wrapper"><div class="brand-dot"></div><div class="brand-name">Md Asif Rahman</div><div class="brand-role">BUSINESS CONSULTANT</div></a></div><a class="nav-cta" href="https://wa.me/8801314399588">Get in Touch</a></header><main id="case-root" class="case-container"></main><script>const projects={'bongo-foods':{type:'BRAND · E-COMMERCE · GROWTH',title:'Bongo Foods',intro:'A consumer food brand built around differentiated snacking, product positioning, e-commerce and performance marketing.',tags:['Brand Strategy','E-commerce','Meta Ads','Growth'],sections:[['The idea','Build a modern Bangladeshi snack brand that feels more distinctive than a typical nuts business, with a strong product story and a direct path from content to purchase.'],['The challenge','The category is crowded and customers can easily compare products on price. The project therefore needs a clear reason to choose the brand, strong creative communication and a frictionless purchase journey.'],['Strategy & positioning','Position the products around taste, experience and everyday snacking rather than competing only as a commodity nut seller. Build trust through product-focused creative, clear offers and consistent brand presentation.'],['Execution','Develop the e-commerce experience, product pages, creative direction, Meta advertising structure and conversion journey. Use real product content to test messages and learn which angles create purchase intent.'],['What I am building toward','A repeatable acquisition system where creative, tracking, product economics and customer experience work together — allowing the brand to grow without losing control of its margins.']]},'vangari':{type:'STARTUP · RECYCLING · PLATFORM',title:'Vangari',intro:'A digital scrap collection platform connecting households and businesses with verified collectors and recycling operations.',tags:['Startup','Platform','Operations','Recycling'],sections:[['The idea','Turn an informal scrap-selling process into a more trusted, transparent and convenient digital service. Users request pickup while verified collectors handle collection and payment.'],['The problem','Scrap collection is fragmented, pricing can be unclear and reliable pickup is difficult to coordinate. A digital layer can connect supply, collectors, sorting operations and downstream recyclers.'],['Product system','The platform is designed around a user app, collector app and admin operations, with future expansion into warehouse management and a marketplace for processed recyclable materials.'],['Business model & operations','The model connects household and SME collection with sorting and aggregation. Materials can then move to recycling partners, creating value through volume, logistics and better operational coordination.'],['Current direction','Build a practical, scalable system first: reliable pickup, transparent transactions, operational visibility and strong unit economics.']]},'webzen':{type:'DIGITAL · AGENCY · SERVICES',title:'WebZen',intro:'A digital service initiative focused on websites, server-side tracking, marketing systems and paid acquisition.',tags:['Web Development','Tracking','Meta Ads','Marketing'],sections:[['The idea','Create a focused digital service operation that helps businesses build their web presence and connect it to measurable marketing.'],['The problem','Many businesses have websites and ads that operate separately. Without proper tracking and a clear conversion path, it becomes difficult to know what marketing is actually producing.'],['Service system','Combine website development, server-side tracking, analytics and paid acquisition into a practical growth stack rather than treating each service as an isolated deliverable.'],['Execution','Build lightweight websites, implement reliable measurement, connect marketing channels and improve the customer journey from first click to conversion.'],['What success looks like','Clients should have a digital foundation they can understand, measure and improve — not simply a website that looks good.']]}};const key=new URLSearchParams(location.search).get('project')||'bongo-foods';const p=projects[key]||projects['bongo-foods'];document.title=p.title+' Case Study | Md Asif Rahman';document.getElementById('case-root').innerHTML='<div class="case-kicker">'+p.type+'</div><h1>'+p.title+'</h1><p class="case-intro">'+p.intro+'</p><div class="case-meta">'+p.tags.map(t=>'<span>'+t+'</span>').join('')+'</div><div class="case-layout"><article>'+p.sections.map(s=>'<section class="case-section"><h2>'+s[0]+'</h2><p>'+s[1]+'</p></section>').join('')+'</article><aside class="case-aside"><div><small>PROJECT CASE STUDY</small><strong>How the idea becomes a working business.</strong><a href="https://wa.me/8801314399588">Discuss a project →</a></div></aside></div><nav class="case-bottom"><a href="projects.html">← Back to all projects</a><a href="pricing.html">Work with me →</a></nav>';const schema={"@context":"https://schema.org","@type":"CreativeWork","name":p.title+' Case Study','description':p.intro,'url':location.href,'author':{"@type":"Person","name":"Md Asif Rahman","url":"https://mdasifrahman.com/"}};const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(schema);document.head.appendChild(s);</script><script src="language.js"></script></body></html>
